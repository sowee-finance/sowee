# Builds the two container images and pushes them to GHCR.
#
# The images are built here and nowhere else. The host that serves them is a small shared box:
# a Next build there competes with everything else on it, and twice took the whole machine down.
# Deploying is now a pull, not a build.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "NEXT_PUBLIC_API_URL baked into the web bundle"
        default: "https://api.sowee.site"
      chain_id:
        description: "NEXT_PUBLIC_CHAIN_ID"
        default: "296"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: api image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          # The Go module graph and build cache, kept between runs.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    name: web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          # Next inlines these into the client bundle and derives the CSP from the API origin,
          # so they are fixed when the image is built, not when it is started.
          build-args: |
            NEXT_PUBLIC_CHAIN_ID=${{ inputs.chain_id || '296' }}
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || 'https://api.sowee.site' }}
            NEXT_PUBLIC_HCS_TOPIC_ID=0.0.10388277
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
