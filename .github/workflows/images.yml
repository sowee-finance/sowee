# Builds the container images and pushes them to GHCR.
#
# The images are built here and nowhere else. The host that serves them is a small shared box:
# a Next build there competes with everything else on it, and twice took the whole machine down.
# Deploying is now a pull, not a build.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/landing/**"
      - "apps/api/**"
      - "contracts/deployments/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/images.yml"
  # A pull request that touches the landing builds its image without pushing one. The Dockerfile
  # is otherwise unproven until it is already on main, and the host only ever pulls.
  pull_request:
    paths:
      - "apps/landing/**"
      - "apps/web/Dockerfile"
      - "bun.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "NEXT_PUBLIC_API_URL baked into the web bundle"
        default: "https://api.sowee.site"
      chain_id:
        description: "NEXT_PUBLIC_CHAIN_ID"
        default: "296"
      bundle:
        description: "Also upload the images as tarballs, for a host that cannot reach GHCR"
        type: boolean
        default: false

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  api:
    name: api image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          # The Go module graph and build cache, kept between runs.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    name: web image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          # Next inlines these into the client bundle and derives the CSP from the API origin,
          # so they are fixed when the image is built, not when it is started.
          build-args: |
            NEXT_PUBLIC_CHAIN_ID=${{ inputs.chain_id || '296' }}
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || 'https://api.sowee.site' }}
            NEXT_PUBLIC_HCS_TOPIC_ID=0.0.10388277
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  landing:
    name: landing image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          platforms: linux/amd64
          # Built on a pull request, pushed only from main.
          push: ${{ github.event_name != 'pull_request' }}
          # Canonical, Open Graph and the sitemap are absolute, so the public origin is fixed
          # when the image is built.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://sowee.site
          tags: |
            ghcr.io/${{ github.repository }}-landing:latest
            ghcr.io/${{ github.repository }}-landing:${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  # A host with no registry credentials can still be deployed to: the same images, saved as
  # tarballs and shipped over ssh (`docker load`). Off by default; it doubles the build.
  bundle:
    name: image tarballs
    if: github.event_name != 'pull_request' && inputs.bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api tarball
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          tags: sowee-api:bundle
          outputs: type=docker,dest=/tmp/sowee-api.tar
          cache-from: type=gha,scope=api
      - name: web tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_CHAIN_ID=${{ inputs.chain_id || '296' }}
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || 'https://api.sowee.site' }}
            NEXT_PUBLIC_HCS_TOPIC_ID=0.0.10388277
          tags: sowee-web:bundle
          outputs: type=docker,dest=/tmp/sowee-web.tar
          cache-from: type=gha,scope=web
      - name: landing tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          platforms: linux/amd64
          tags: sowee-landing:bundle
          outputs: type=docker,dest=/tmp/sowee-landing.tar
          cache-from: type=gha,scope=landing
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: /tmp/sowee-*.tar
          retention-days: 1
          compression-level: 6
