# Sowee subgraph schema — Hedera testnet, self-hosted graph-node.

"A primary-market listing (InvoiceMarket.InvoiceListed). id = invoiceId."
type Invoice @entity(immutable: false) {
  id: Bytes!
  issuer: Bytes!
  bond: Bytes!
  totalUnits: BigInt!
  unitsRemaining: BigInt!
  pricePerUnit: BigInt!
  "Unix seconds."
  maturity: BigInt!
  cancelled: Boolean!
  "Block timestamp of the listing, unix seconds."
  listedAt: BigInt!
  listedTx: Bytes!
  "Latest consumed discount quote (same id as the invoice)."
  quote: Quote
  settlement: Settlement
  purchases: [PrimaryPurchase!]! @derivedFrom(field: "invoice")
  asks: [Ask!]! @derivedFrom(field: "invoice")
}

"Latest DiscountOracle.QuoteConsumed per invoice. id = invoiceId (latest wins)."
type Quote @entity(immutable: false) {
  id: Bytes!
  invoice: Invoice!
  nonce: BigInt!
  faceValue: BigInt!
  discountRateBps: Int!
  consumedAt: BigInt!
  txHash: Bytes!
}

"A primary fill (InvoiceMarket.PrimaryPurchase). id = txHash ++ logIndex."
type PrimaryPurchase @entity(immutable: true) {
  id: Bytes!
  invoice: Invoice!
  buyer: Bytes!
  units: BigInt!
  cost: BigInt!
  fee: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"A secondary-market ask (InvoiceMarket.AskCreated). id = askId as bytes."
type Ask @entity(immutable: false) {
  id: Bytes!
  askId: BigInt!
  invoice: Invoice!
  seller: Bytes!
  units: BigInt!
  unitsRemaining: BigInt!
  pricePerUnit: BigInt!
  cancelled: Boolean!
  createdAt: BigInt!
  fills: [AskFill!]! @derivedFrom(field: "ask")
}

"A secondary fill (InvoiceMarket.AskFilled). id = txHash ++ logIndex."
type AskFill @entity(immutable: true) {
  id: Bytes!
  ask: Ask!
  buyer: Bytes!
  units: BigInt!
  cost: BigInt!
  fee: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"An ask cancellation (InvoiceMarket.AskCancelled). id = txHash ++ logIndex."
type AskCancel @entity(immutable: true) {
  id: Bytes!
  ask: Ask!
  unitsReturned: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"Maturity settlement lifecycle (MaturitySettlement.*). id = invoiceId."
type Settlement @entity(immutable: false) {
  id: Bytes!
  invoice: Invoice!
  bond: Bytes!
  "Unix seconds."
  maturity: BigInt!
  "Cumulative USDC deposited by the payor (RepaymentDeposited.totalRepayment)."
  totalRepayment: BigInt!
  "HSS schedule address, once SettlementScheduled fires."
  scheduleAddress: Bytes
  scheduleExpiry: BigInt
  settled: Boolean!
  "Final repayment escrowed at Settled."
  repayment: BigInt!
  supplySnapshot: BigInt!
  settledAt: BigInt
  claims: [Claim!]! @derivedFrom(field: "settlement")
}

"A pro-rata payout claim (MaturitySettlement.Claimed). id = txHash ++ logIndex."
type Claim @entity(immutable: true) {
  id: Bytes!
  settlement: Settlement!
  holder: Bytes!
  units: BigInt!
  payout: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}
