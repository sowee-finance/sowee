[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"

# Hedera testnet (chainId 296) via the Hashio JSON-RPC relay.
# Hedera charges at least 80% of the gas *limit*, so estimates are padded on deploy.
[rpc_endpoints]
hedera_testnet = "${HEDERA_TESTNET_RPC}"
arc_testnet = "${ARC_TESTNET_RPC}"
